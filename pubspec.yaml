name: ym_share
description: Flutter plugin for sharing content via the platform share UI, using
  the ACTION_SEND intent on Android and UIActivityViewController on iOS.
homepage: https://github.com/yashmanghnani/ym_share
repository: https://github.com/yashmanghnani/ym_share
version: 1.0.1

flutter:
  plugin:
    platforms:
      android:
        package: io.flutter.plugins.share
        pluginClass: SharePlugin
      ios:
        pluginClass: FLTSharePlugin

dependencies:
  meta: ^1.19.0
  mime: ^2.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.29.3"
