name: share_example
description: Demonstrates how to use the ym_share plugin.
publish_to: none
version: 1.0.0+1

dependencies:
  flutter:
    sdk: flutter
  ym_share:
    # When depending on this package from a real application you should use:
    #   ym_share: ^1.0.0
    # See https://dart.dev/tools/pub/dependencies#version-constraints
    # The example app is bundled with the plugin so we use a path dependency on
    # the parent directory to use the current plugin's version.
    path: ../
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.29.3"
